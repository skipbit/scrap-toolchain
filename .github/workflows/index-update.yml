name: Index Update

# Trigger: ingot-cast completion on main (any conclusion) or manual dispatch.
# Runs on every conclusion so that the molds a failed run did publish still
# reach the index. Runs on other branches are skipped: their ingots come
# from molds that are not on main.
on:
  workflow_run:
    workflows: ['Ingot Cast']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: index-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  update-index:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Download artifacts from the triggering ingot-cast run.
      # Downloads all artifacts (package-manifest JSON + ingot metadata).
      # Only the JSON files are used by generate-index.sh, but selective
      # download within an artifact is not supported by download-artifact.
      # When the run has no artifacts (it skipped the builds, or they
      # expired), the download still succeeds and creates no directory.
      # generate-index.sh falls back to the OCI Registry API for each mold
      # whose package-manifest is absent.
      - name: Download artifacts
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/
          merge-multiple: true

      - name: Report artifact status
        if: github.event_name == 'workflow_run'
        env:
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Triggering run: ${TRIGGERING_RUN_ID}"
          if [[ -d artifacts ]]; then
            echo "ARTIFACT_DIR=artifacts" >> "$GITHUB_ENV"
            echo "Artifact files:"
            find artifacts/ -type f -name '*.json' | sort
          else
            echo "No artifacts available; generate-index.sh will use API fallback"
          fi

      - name: Generate index
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/generate-index.sh
          scripts/generate-index.sh

      # A failure here leaves index.toml unpushed.
      - name: Check index against molds
        run: python3 scripts/check-index.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$(git status --porcelain -- index.toml)" ]]; then
            echo "No changes to index.toml"
            exit 0
          fi

          git config user.name "scrap-toolchain-ci[bot]"
          git config user.email "scrap-toolchain-ci[bot]@users.noreply.github.com"

          git add index.toml
          git commit -m "chore: update index.toml"

          MAX_RETRIES=3
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if git push; then
              echo "Successfully pushed (attempt ${attempt})"
              exit 0
            fi

            echo "Push failed (attempt ${attempt}/${MAX_RETRIES})"
            if [[ "$attempt" -lt "$MAX_RETRIES" ]]; then
              # Discard the pending commit, pull latest, regenerate, and recommit.
              # This handles the case where another index-update run pushed between
              # our commit and push, avoiding rebase conflicts on index.toml.
              git reset --soft HEAD~1
              git restore --staged --worktree index.toml
              git pull --rebase

              chmod +x scripts/generate-index.sh
              scripts/generate-index.sh
              python3 scripts/check-index.py

              if [[ -z "$(git status --porcelain -- index.toml)" ]]; then
                echo "No changes after regeneration"
                exit 0
              fi

              git add index.toml
              git commit -m "chore: update index.toml"
            fi
          done

          echo "::error::Failed to push after ${MAX_RETRIES} attempts"
          exit 1
