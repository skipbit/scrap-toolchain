name: Probe smoke test on GCC

on:
  pull_request:
    paths:
      - '.github/workflows/probe-smoke-test-gcc.yml'
      - 'scripts/smoke-test.sh'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ingots: ${{ steps.plan.outputs.ingots }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, tomllib
          runners = {"x86_64": "ubuntu-24.04", "aarch64": "ubuntu-24.04-arm"}
          with open("index.toml", "rb") as f:
              index = tomllib.load(f)
          ingots = [
              {"version": t["version"], "arch": i["arch"], "runner": runners[i["arch"]],
               "ref": i["registry"] + "/" + i["tag"].partition(":")[0] + "@" + i["digest"]}
              for t in index["toolchains"] if t["family"] == "gcc"
              for i in t["ingots"]
          ]
          print("ingots=" + json.dumps(ingots))
          PY

  smoke-test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        ingot: ${{ fromJSON(needs.plan.outputs.ingots) }}
    name: smoke-test (gcc ${{ matrix.ingot.version }} ${{ matrix.ingot.arch }})
    runs-on: ${{ matrix.ingot.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - name: Smoke test
        env:
          REF: ${{ matrix.ingot.ref }}
          VERSION: ${{ matrix.ingot.version }}
        run: |
          oras pull -o "$RUNNER_TEMP/pulled" "$REF" > /dev/null
          mapfile -t archives < <(find "$RUNNER_TEMP/pulled" -name '*.tar.xz' -type f)
          [[ ${#archives[@]} -eq 1 ]]
          mkdir "$RUNNER_TEMP/ingot"
          tar -xJf "${archives[0]}" -C "$RUNNER_TEMP/ingot"
          scripts/smoke-test.sh "$RUNNER_TEMP/ingot" "molds/gcc/$VERSION"
