name: Scrap Run Check

# Installs the macOS toolchains of an index with a release of scrap, and
# runs a program built with each of them. Run it by hand after the macOS
# toolchains of the index change.
on:
  workflow_dispatch:
    inputs:
      scrap_version:
        description: 'Release of scrap to use (e.g., 0.5.0); the latest when empty'
        required: false
        type: string
      index_ref:
        description: 'Branch, tag or commit whose index.toml scrap reads'
        required: false
        default: 'main'
        type: string
      toolchains:
        description: 'Toolchains to check, separated by spaces (e.g., llvm@22.1.8); every macOS toolchain of the index when empty'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download scrap
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAP_VERSION: ${{ inputs.scrap_version }}
        run: |
          set -euo pipefail
          if [[ -z "$SCRAP_VERSION" ]]; then
            SCRAP_VERSION=$(gh release view -R skipbit/scrap --json tagName --jq '.tagName | ltrimstr("v")')
          fi
          ARCHIVE="scrap-${SCRAP_VERSION}-darwin-aarch64.tar.gz"
          DIR="${RUNNER_TEMP}/scrap"
          mkdir -p "$DIR"
          gh release download "v${SCRAP_VERSION}" -R skipbit/scrap -D "$DIR" -p "$ARCHIVE" -p "${ARCHIVE}.sha256"
          (cd "$DIR" && shasum -a 256 -c "${ARCHIVE}.sha256")
          tar -xzf "${DIR}/${ARCHIVE}" -C "$DIR"
          echo "SCRAP=${DIR}/scrap-${SCRAP_VERSION}-darwin-aarch64/scrap" >> "$GITHUB_ENV"

      - name: Check the toolchains
        env:
          INDEX_REF: ${{ inputs.index_ref }}
          TOOLCHAINS: ${{ inputs.toolchains }}
        run: |
          set -euo pipefail
          INDEX_COMMIT=$(git rev-parse --verify --quiet "origin/${INDEX_REF}^{commit}" \
            || git rev-parse --verify "${INDEX_REF}^{commit}")
          git show "${INDEX_COMMIT}:index.toml" > "${RUNNER_TEMP}/index.toml"
          if [[ -z "$TOOLCHAINS" ]]; then
            TOOLCHAINS=$(python3 - "${RUNNER_TEMP}/index.toml" <<'EOF'
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              index = tomllib.load(f)
          print(' '.join(f"{toolchain['family']}@{toolchain['version']}"
                         for toolchain in index['toolchains']
                         if any(ingot['platform'] == 'darwin' for ingot in toolchain['ingots'])))
          EOF
            )
          fi
          read -r -a SPECIFIERS <<< "$TOOLCHAINS"
          # A commit, not a branch, so that a cached copy of the file is not read.
          export SCRAP_TOOLCHAIN_INDEX="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${INDEX_COMMIT}/index.toml"
          echo "Index: ${SCRAP_TOOLCHAIN_INDEX}"
          scripts/check-scrap-runs-toolchains.sh "$SCRAP" "${SPECIFIERS[@]}"
