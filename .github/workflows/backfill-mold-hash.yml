name: Backfill Mold Hash

# Adds org.skipbit.scrap.mold_hash to the OCI Indexes cast before Ingot
# Cast recorded it, so that generate-index.sh can match their ingots to
# the molds. Only the index annotations change; the ingots and their
# digests stay. Dispatch with dry_run first and read the plan.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan without pushing'
        type: boolean
        default: true

# Not in the group of Ingot Cast: GitHub keeps one pending run per group,
# so joining it could cancel a queued cast. The job stops instead when a
# cast is running or queued.
concurrency:
  group: backfill-mold-hash
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Stop while Ingot Cast is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ingot-cast.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [[ "$active" -ne 0 ]]; then
            echo "::error::${active} Ingot Cast run(s) are not completed; dispatch again later"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Exits 1 when a version is left out. The planned versions are still
      # pushed, and the job fails at this step.
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/backfill-mold-hash.py planned-indexes

      - name: Set up oras
        if: ${{ !cancelled() && !inputs.dry_run && steps.plan.outcome != 'skipped' }}
        uses: oras-project/setup-oras@v2
        with:
          version: '1.2.2'

      - name: Log in to ghcr.io
        if: ${{ !cancelled() && !inputs.dry_run && steps.plan.outcome != 'skipped' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin

      # Pushes each planned index and reads it back. A tag whose children
      # changed since the plan is skipped, so a cast in between is kept.
      - name: Push
        if: ${{ !cancelled() && !inputs.dry_run && steps.plan.outcome != 'skipped' }}
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pushed=0
          failed=0
          for planned in planned-indexes/*/*.json; do
            family=$(basename "$(dirname "$planned")")
            version=$(basename "$planned" .json)
            ref="${REGISTRY}/${family}:${version}"
            children=$(jq -c '[.manifests[].digest]' "$planned")

            if ! oras manifest fetch "$ref" \
              | jq -e --argjson c "$children" '[.manifests[].digest] == $c' >/dev/null; then
              echo "::error::${family} ${version}: the tag changed since the plan; skipped"
              failed=$((failed + 1))
              continue
            fi

            if ! oras manifest push "$ref" "$planned" \
              --media-type "application/vnd.oci.image.index.v1+json"; then
              echo "::error::${family} ${version}: push failed"
              failed=$((failed + 1))
              continue
            fi

            if oras manifest fetch "$ref" \
              | jq -e --slurpfile p "$planned" '. == $p[0]' >/dev/null; then
              pushed=$((pushed + 1))
            else
              echo "::error::${family} ${version}: does not read back as pushed"
              failed=$((failed + 1))
            fi
          done
          echo "${pushed} pushed, ${failed} failed"
          [[ "$failed" -eq 0 ]]
