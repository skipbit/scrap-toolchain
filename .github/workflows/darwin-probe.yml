name: Darwin probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  dyld:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 17.0.6
            url: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang%2Bllvm-17.0.6-arm64-apple-darwin22.0.tar.xz
            sha256: 1264eb3c2a4a6d5e9354c3e5dc5cb6c6481e678f6456f36d2e0e566e9400fcad
          - version: 23.1.5
            url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-macOS-ARM64.tar.xz
            sha256: aba592b4a15e8f90c634c5367b51ec8418b8bcd2829865db331a17dc9418dcff
    steps:
      - uses: actions/checkout@v7
      - name: Extract LLVM ${{ matrix.version }}
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/llvm.tar.xz" "$URL"
          echo "${SHA256}  ${RUNNER_TEMP}/llvm.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/ingot"
          tar -xJf "${RUNNER_TEMP}/llvm.tar.xz" -C "${RUNNER_TEMP}/ingot" --strip-components 1
      - name: Show what libc++ of the ingot depends on
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/ingot/lib"
          ls -l libc++* libunwind*
          for lib in libc++.1.dylib libc++abi.1.dylib; do
            if [[ -e "$lib" ]]; then
              otool -L "$lib"
            fi
          done
      - name: Count dyld lines through env and timeout
        run: |
          set -euo pipefail
          brew install coreutils
          command -v gtimeout
          cd "$RUNNER_TEMP"
          printf 'int main(void) { return 0; }\n' > h.c
          cc -o h h.c
          DYLD_PRINT_LIBRARIES=1 ./h 2> direct
          env DYLD_PRINT_LIBRARIES=1 ./h 2> env-sets
          DYLD_PRINT_LIBRARIES=1 env ./h 2> env-inherits
          gtimeout 30 env DYLD_PRINT_LIBRARIES=1 ./h 2> gtimeout-env-sets
          DYLD_PRINT_LIBRARIES=1 gtimeout 30 ./h 2> gtimeout-inherits
          for f in direct env-sets env-inherits gtimeout-env-sets gtimeout-inherits; do
            echo "${f}: $(grep -c '^dyld\[' "$f" || true) lines, $(grep -c '/h$' "$f" || true) for h, $(grep -c 'gtimeout$' "$f" || true) for gtimeout"
          done
      - name: Run the smoke test with gtimeout
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh "${RUNNER_TEMP}/ingot" "molds/llvm/${{ matrix.version }}"
