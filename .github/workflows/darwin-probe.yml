name: Darwin probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  libcxx-19:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test LLVM 19.1.7 with the smoke test of this branch and of main
        env:
          URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-macOS-ARM64.tar.xz
          SHA256: d93bf12952d89fe4ec7501c40475718b722407da6a8d651f05c995863468e570
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/llvm.tar.xz" "$URL"
          echo "${SHA256}  ${RUNNER_TEMP}/llvm.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/ingot"
          tar -xJf "${RUNNER_TEMP}/llvm.tar.xz" -C "${RUNNER_TEMP}/ingot" --strip-components 1
          git show origin/main:scripts/smoke-test.sh > "${RUNNER_TEMP}/smoke-test-main.sh"
          chmod +x scripts/smoke-test.sh "${RUNNER_TEMP}/smoke-test-main.sh"
          set +e
          scripts/smoke-test.sh "${RUNNER_TEMP}/ingot" molds/llvm/19.1.7
          BRANCH_EXIT=$?
          "${RUNNER_TEMP}/smoke-test-main.sh" "${RUNNER_TEMP}/ingot" molds/llvm/19.1.7
          MAIN_EXIT=$?
          set -e
          echo "branch: rc=${BRANCH_EXIT}, main: rc=${MAIN_EXIT}"
          [[ "$BRANCH_EXIT" -ne 0 && "$MAIN_EXIT" -eq 0 ]]

  diagnose:
    strategy:
      fail-fast: false
      matrix:
        version: ['17.0.6', '22.1.8']
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show how the test program of LLVM ${{ matrix.version }} links and loads libc++
        env:
          MOLD: molds/llvm/${{ matrix.version }}/mold.toml
        run: |
          set -euo pipefail
          read -r URL SHA256 < <(python3 -c '
          import sys, tomllib
          d = tomllib.load(open(sys.argv[1], "rb"))
          b = next(b for b in d["source"]["binaries"] if b["platform"] == "darwin")
          print(b["url"], b["sha256"])' "$MOLD")
          curl -sSfL -o "${RUNNER_TEMP}/llvm.tar.xz" "$URL"
          echo "${SHA256}  ${RUNNER_TEMP}/llvm.tar.xz" | shasum -a 256 -c -
          ING="${RUNNER_TEMP}/ingot"
          mkdir -p "$ING"
          tar -xJf "${RUNNER_TEMP}/llvm.tar.xz" -C "$ING" --strip-components 1
          SDKROOT=$(xcrun --show-sdk-path)
          export SDKROOT
          echo "SDKROOT=${SDKROOT}"
          echo "--- libraries in lib/"
          find "$ING/lib" -maxdepth 1 \( -name 'libc++*' -o -name 'libunwind*' \) -exec ls -la {} +
          echo "--- otool -D and -L of lib/libc++.1.dylib"
          otool -D "$ING/lib/libc++.1.dylib"
          otool -L "$ING/lib/libc++.1.dylib"
          cd "$RUNNER_TEMP"
          python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["test"]["hello_world_source"], end="")' \
            "${GITHUB_WORKSPACE}/${MOLD}" > hello.cpp
          echo "--- link, with the files ld reads"
          "$ING/bin/clang++" -std=c++23 -o hello hello.cpp -L "$ING/lib" -Xlinker -rpath -Xlinker "$ING/lib" -lc++abi -Wl,-t \
            | grep -E 'libc\+\+|unwind|libSystem' || true
          echo "--- otool -L of hello"
          otool -L hello
          echo "--- LC_RPATH of hello"
          otool -l hello | grep -A2 LC_RPATH
          echo "--- DYLD_PRINT_LIBRARIES"
          DYLD_PRINT_LIBRARIES=1 ./hello
