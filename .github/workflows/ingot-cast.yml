name: Ingot Cast

on:
  push:
    branches: [main]
    # Wider than the rebuild condition in detect-build-targets on purpose:
    # this run's completion is what starts Index Update, so a change to
    # generate-index.sh still refreshes index.toml without building.
    paths:
      - 'molds/**'
      - 'scripts/**'
      - 'schema/**'
      - 'platforms.toml'
  workflow_dispatch:
    inputs:
      mold_path:
        description: 'Mold path to build (e.g., molds/llvm/18.1.8)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ingot-cast
  cancel-in-progress: false

jobs:
  detect-build-targets:
    runs-on: ubuntu-24.04
    outputs:
      has_build_targets: ${{ steps.detect.outputs.has_build_targets }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      has_fetch_targets: ${{ steps.detect.outputs.has_fetch_targets }}
      fetch_matrix: ${{ steps.detect.outputs.fetch_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Detect build targets
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MOLD_PATH_INPUT: ${{ inputs.mold_path }}
        run: |
          set -euo pipefail

          no_targets() {
            {
              echo "has_build_targets=false"
              echo 'build_matrix={"include":[]}'
              echo "has_fetch_targets=false"
              echo 'fetch_matrix={"include":[]}'
            } >> "$GITHUB_OUTPUT"
          }

          # === Step 1: Identify changed molds ===

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # workflow_dispatch: use mold_path directly
            MOLD_PATH="${MOLD_PATH_INPUT%/}"
            if ! [[ "$MOLD_PATH" =~ ^molds/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Invalid mold path format: ${MOLD_PATH}"
              exit 1
            fi
            if [[ ! -f "${MOLD_PATH}/mold.toml" ]]; then
              echo "::error::Mold not found: ${MOLD_PATH}"
              exit 1
            fi
            CHANGED_MOLDS=("$MOLD_PATH")
          else
            # Push event: detect changes via git diff
            # Guard against null SHA on initial push
            NULL_SHA="0000000000000000000000000000000000000000"
            if [[ "$BEFORE_SHA" == "$NULL_SHA" ]]; then
              ALL_CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
            else
              ALL_CHANGED_FILES=$(git diff --name-only "${BEFORE_SHA}..${CURRENT_SHA}" || true)
            fi

            if [[ -z "$ALL_CHANGED_FILES" ]]; then
              echo "No changes detected"
              no_targets
              exit 0
            fi

            # Check for infrastructure changes that affect all molds.
            # Only the files that decide an ingot's content qualify:
            # cast-ingot.sh is the build, remove-needed.sh rewrites files
            # of fetch ingots, and platforms.toml picks the container that
            # sets the glibc baseline. The rest affect how
            # builds run, not what is built — smoke-test.sh verifies the
            # ingot after it is packed, validate-mold.sh and schema/ belong
            # to pr-validation.yml, and generate-index.sh runs afterwards in
            # index-update.yml. Rebuilding for those would republish a
            # version from a different build for no gain; use
            # workflow_dispatch to rebuild a mold on purpose.
            INFRA_CHANGED=$(echo "$ALL_CHANGED_FILES" | grep -E '^(platforms\.toml|scripts/cast-ingot\.sh|scripts/remove-needed\.sh)$' || true)

            # Extract mold-specific changes
            MOLD_CHANGED_FILES=$(echo "$ALL_CHANGED_FILES" | grep '^molds/' || true)

            if [[ -z "$INFRA_CHANGED" ]] && [[ -z "$MOLD_CHANGED_FILES" ]]; then
              echo "No relevant changes detected (no mold or infrastructure changes)"
              no_targets
              exit 0
            fi

            CHANGED_MOLDS=()

            # --- Infrastructure change: include ALL existing molds ---
            # (fetch vs build filtering happens in Step 2 below)
            if [[ -n "$INFRA_CHANGED" ]]; then
              echo "Infrastructure change detected:"
              echo "$INFRA_CHANGED" | while IFS= read -r f; do echo "  - $f"; done
              echo "All existing molds will be evaluated for rebuild."

              ALL_MOLD_DIRS=$(find molds -name "mold.toml" -not -path "*/\.*" 2>/dev/null \
                | sed 's|/mold\.toml$||' | sort -u || true)
              while IFS= read -r mold_dir; do
                [[ -z "$mold_dir" ]] && continue
                CHANGED_MOLDS+=("$mold_dir")
              done <<< "$ALL_MOLD_DIRS"
            fi

            # --- Mold-specific changes: add individually changed molds ---
            if [[ -n "$MOLD_CHANGED_FILES" ]]; then
              MOLD_DIRS=$(echo "$MOLD_CHANGED_FILES" \
                | sed 's|^\(molds/[^/]*/[^/]*\)/.*|\1|; s|^\(molds/[^/]*/[^/]*\)$|\1|' \
                | sort -u)

              # Source-change detection: skip metadata-only changes.
              # Only applies when INFRA_CHANGED is empty (infra changes
              # rebuild all molds regardless of their individual changes).
              # scripts/mold-hash.py hashes the same parts of a mold; change
              # the two together.
              if [[ -z "$INFRA_CHANGED" ]]; then
                CHECK_SCRIPT=$(mktemp)
                trap 'rm -f "$CHECK_SCRIPT"' EXIT
                cat > "$CHECK_SCRIPT" << 'CHECKEOF'
          import tomllib, subprocess, sys, os

          mold_dir = os.environ['MOLD_DIR_VAR']
          before_sha = os.environ['BEFORE_SHA_VAR']

          result = subprocess.run(
              ['git', 'show', f'{before_sha}:{mold_dir}/mold.toml'],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print('true')
              sys.exit(0)

          old = tomllib.loads(result.stdout)
          with open(f'{mold_dir}/mold.toml', 'rb') as f:
              new = tomllib.load(f)

          if (old.get('source') != new.get('source')
              or old.get('test') != new.get('test')
              or old.get('patches') != new.get('patches')):
              print('true')
          else:
              print('false')
          CHECKEOF

                while IFS= read -r mold_dir; do
                  [[ -z "$mold_dir" ]] && continue
                  [[ ! -f "${mold_dir}/mold.toml" ]] && continue

                  NEEDS_BUILD=false

                  if echo "$MOLD_CHANGED_FILES" | grep -q "^${mold_dir}/patches/"; then
                    NEEDS_BUILD=true
                  fi

                  if echo "$MOLD_CHANGED_FILES" | grep -q "^${mold_dir}/mold.toml$"; then
                    if [[ "$BEFORE_SHA" == "$NULL_SHA" ]]; then
                      NEEDS_BUILD=true
                    else
                      SOURCE_CHANGED=$(MOLD_DIR_VAR="$mold_dir" BEFORE_SHA_VAR="$BEFORE_SHA" python3 "$CHECK_SCRIPT")
                      if [[ "$SOURCE_CHANGED" == "true" ]]; then
                        NEEDS_BUILD=true
                      fi
                    fi
                  fi

                  if [[ "$NEEDS_BUILD" == "true" ]]; then
                    CHANGED_MOLDS+=("$mold_dir")
                  else
                    echo "Skipping ${mold_dir}: no source/patches changes"
                  fi
                done <<< "$MOLD_DIRS"
              else
                # INFRA_CHANGED is set — all molds already included above.
                # Individual mold changes are redundant (union is handled
                # by dedup below).
                :
              fi
            fi

            # Deduplicate (infra + individual mold changes may overlap)
            if [[ ${#CHANGED_MOLDS[@]} -gt 0 ]]; then
              mapfile -t CHANGED_MOLDS < <(printf '%s\n' "${CHANGED_MOLDS[@]}" | sort -u)
            fi
          fi

          if [[ ${#CHANGED_MOLDS[@]} -eq 0 ]]; then
            echo "No build targets detected"
            no_targets
            exit 0
          fi

          # === Step 2: Classify by source type ===
          # Fetch-type molds are validated in pr-validation.yml. Only the
          # platforms whose binary entry removes DT_NEEDED entries produce
          # ingots here, since those binaries differ from the upstream ones.

          BUILD_MOLD_DIRS=()
          FETCH_MOLD_DIRS=()
          declare -A FETCH_PLATFORM_IDS

          for mold in "${CHANGED_MOLDS[@]}"; do
            SOURCE_TYPE=$(MOLD_VAR="$mold" python3 -c "
          import tomllib, os
          mold = os.environ['MOLD_VAR']
          with open(f'{mold}/mold.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['source']['type'])
          ")

            echo "Detected: ${mold} (${SOURCE_TYPE})"

            if [[ "$SOURCE_TYPE" == "fetch" ]]; then
              CAST_IDS=$(MOLD_VAR="$mold" python3 -c "
          import tomllib, os
          mold = os.environ['MOLD_VAR']
          with open(f'{mold}/mold.toml', 'rb') as f:
              data = tomllib.load(f)
          for b in data['source']['binaries']:
              if b.get('remove_needed'):
                  print(f\"{b['platform']}-{b['arch']}\")
          ")
              if [[ -z "$CAST_IDS" ]]; then
                echo "::notice::Fetch type: ${mold} — validated in pr-validation.yml only"
                continue
              fi
              FETCH_MOLD_DIRS+=("$mold")
              FETCH_PLATFORM_IDS["$mold"]="$CAST_IDS"
              echo "::notice::Fetch type with removed DT_NEEDED entries: ${mold}"
            elif [[ "$SOURCE_TYPE" == "build" ]]; then
              BUILD_MOLD_DIRS+=("$mold")
              echo "::notice::Build type detected: ${mold}"
            fi
          done

          # === Step 3: Generate matrices ===
          # Cross each mold with its Tier 1 platforms from platforms.toml.
          # A build-type mold keeps the platforms in source.platforms.supported
          # when it is specified; a fetch-type mold keeps the platforms that
          # remove DT_NEEDED entries. The build matrix is consumed by the
          # cast-build-configure/make/package jobs, the fetch matrix by
          # cast-fetch.

          TIER1_PLATFORMS=$(python3 -c "
          import tomllib, json
          with open('platforms.toml', 'rb') as f:
              data = tomllib.load(f)
          for p in data['platforms']['tier1']:
              print(json.dumps(p))
          ")

          # Read glibc container mapping for container resolution
          GLIBC_MAP=$(python3 -c "
          import tomllib, json
          with open('platforms.toml', 'rb') as f:
              data = tomllib.load(f)
          print(json.dumps(data.get('glibc_containers', {})))
          ")

          # Appends to the array named by the third argument one matrix entry
          # per Tier 1 platform of a mold, limited to the platform IDs given
          # (one per line, e.g. linux-x86_64) when there are any.
          add_matrix_entries() {
            local mold="$1" only="$2"
            local -n entries="$3"
            local ENTRY MOLD_META FAMILY VERSION GLIBC_MIN platform_entry PLAT ARCH
            local PLATFORM_ID RUNNER CONTAINER RESOLVED_CONTAINER

            # Read family, version, glibc_min from mold.toml
            MOLD_META=$(MOLD_VAR="$mold" python3 -c "
          import tomllib, json, os
          mold = os.environ['MOLD_VAR']
          with open(f'{mold}/mold.toml', 'rb') as f:
              data = tomllib.load(f)
          print(json.dumps({
              'family': data['metadata']['family'],
              'version': data['metadata']['version'],
              'glibc_min': data.get('source', {}).get('glibc_min', '')
          }))
          ")

            FAMILY=$(echo "$MOLD_META" | jq -r '.family')
            VERSION=$(echo "$MOLD_META" | jq -r '.version')
            GLIBC_MIN=$(echo "$MOLD_META" | jq -r '.glibc_min')

            while IFS= read -r platform_entry; do
              [[ -z "$platform_entry" ]] && continue
              PLAT=$(echo "$platform_entry" | jq -r '.platform')
              ARCH=$(echo "$platform_entry" | jq -r '.arch')

              PLATFORM_ID="${PLAT}-${ARCH}"
              if [[ -n "$only" ]] && ! echo "$only" | grep -qx "$PLATFORM_ID"; then
                echo "  Skip: ${mold} ${PLATFORM_ID}"
                continue
              fi
              RUNNER=$(echo "$platform_entry" | jq -r '.runner')
              CONTAINER=$(echo "$platform_entry" | jq -r '.container // ""')

              # Resolve container image for glibc compatibility (Linux only).
              # When glibc_min is specified, select the smallest glibc container
              # that satisfies the requirement. Otherwise use the default container
              # from platforms.toml (typically ubuntu:20.04 = glibc 2.31).
              if [[ -n "$GLIBC_MIN" && -n "$CONTAINER" && "$PLAT" == "linux" ]]; then
                RESOLVED_CONTAINER=$(echo "$GLIBC_MAP" | GLIBC_MIN_VAR="$GLIBC_MIN" python3 -c "
          import json, sys, os
          glibc_min = os.environ['GLIBC_MIN_VAR']
          glibc_map = json.load(sys.stdin)
          default_container = glibc_map.get('default', {}).get('container', 'ubuntu:20.04') if isinstance(glibc_map.get('default'), dict) else 'ubuntu:20.04'
          candidates = []
          for ver, container in glibc_map.items():
              if ver == 'default' or not isinstance(container, str):
                  continue
              ver_tuple = tuple(int(x) for x in ver.split('.'))
              min_tuple = tuple(int(x) for x in glibc_min.split('.'))
              if ver_tuple >= min_tuple:
                  candidates.append((ver_tuple, container))
          if candidates:
              candidates.sort()
              print(candidates[0][1])
          else:
              print(default_container)
          ")
                CONTAINER="$RESOLVED_CONTAINER"
              fi

              ENTRY=$(jq -cn \
                --arg mold "$mold" \
                --arg family "$FAMILY" \
                --arg version "$VERSION" \
                --arg platform "$PLAT" \
                --arg arch "$ARCH" \
                --arg runner "$RUNNER" \
                --arg container "$CONTAINER" \
                '{mold: $mold, family: $family, version: $version,
                  platform: $platform, arch: $arch,
                  runner: $runner, container: $container}')
              entries+=("$ENTRY")
              echo "  Matrix: ${mold} ${PLATFORM_ID} (runner: ${RUNNER}, container: ${CONTAINER:-native})"
            done <<< "$TIER1_PLATFORMS"
          }

          BUILD_ENTRIES=()
          for mold in "${BUILD_MOLD_DIRS[@]}"; do
            SUPPORTED_PLATFORMS=$(MOLD_VAR="$mold" python3 -c "
          import tomllib, os
          mold = os.environ['MOLD_VAR']
          with open(f'{mold}/mold.toml', 'rb') as f:
              data = tomllib.load(f)
          for p in data.get('source', {}).get('platforms', {}).get('supported', []):
              print(p)
          ")
            add_matrix_entries "$mold" "$SUPPORTED_PLATFORMS" BUILD_ENTRIES
          done

          FETCH_ENTRIES=()
          for mold in "${FETCH_MOLD_DIRS[@]}"; do
            add_matrix_entries "$mold" "${FETCH_PLATFORM_IDS[$mold]}" FETCH_ENTRIES
          done

          HAS_BUILD=false
          BUILD_MATRIX='{"include":[]}'
          if [[ ${#BUILD_ENTRIES[@]} -gt 0 ]]; then
            HAS_BUILD=true
            BUILD_MATRIX=$(printf '%s\n' "${BUILD_ENTRIES[@]}" | jq -cs '{include: .}')
          elif [[ ${#BUILD_MOLD_DIRS[@]} -gt 0 ]]; then
            echo "::warning::Build-type molds detected but no Tier 1 platform entries generated"
          fi

          HAS_FETCH=false
          FETCH_MATRIX='{"include":[]}'
          if [[ ${#FETCH_ENTRIES[@]} -gt 0 ]]; then
            HAS_FETCH=true
            FETCH_MATRIX=$(printf '%s\n' "${FETCH_ENTRIES[@]}" | jq -cs '{include: .}')
          elif [[ ${#FETCH_MOLD_DIRS[@]} -gt 0 ]]; then
            echo "::warning::Fetch-type molds with removed DT_NEEDED entries detected but no Tier 1 platform entries generated"
          fi

          {
            echo "has_build_targets=${HAS_BUILD}"
            echo "build_matrix=${BUILD_MATRIX}"
            echo "has_fetch_targets=${HAS_FETCH}"
            echo "fetch_matrix=${FETCH_MATRIX}"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # Build stages: 3-stage splitting for source-build molds.
  #
  # Each stage runs cast-ingot.sh with CAST_STAGE set to the stage name.
  # Stages communicate via GitHub Actions artifacts (tar.gz).
  #
  # Stage 1 (configure): source download, SHA256, prerequisites, configure
  # Stage 2 (make):      make, make install
  # Stage 3 (package):   layout, license, metadata, archive, smoke test
  #
  # Linux builds run inside a Docker container (for glibc compatibility)
  # launched manually via `docker run` — NOT via the `container:` directive.
  # This allows host-level disk cleanup before the container starts, which
  # is necessary because GCC builds consume 30-50GB of disk space.
  # ============================================================

  cast-build-configure:
    needs: detect-build-targets
    if: needs.detect-build-targets.outputs.has_build_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.detect-build-targets.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Maximize build space
        if: matrix.platform == 'linux'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Run configure stage
        env:
          MOLD: ${{ matrix.mold }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/stage-artifacts"
          mkdir -p "${STAGE_DIR}"
          chmod +x scripts/cast-ingot.sh scripts/smoke-test.sh

          if [[ -n "${CONTAINER}" ]]; then
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace" \
              -v "${STAGE_DIR}:/stage-artifacts" \
              -e CAST_STAGE=configure \
              -e STAGE_ARTIFACT_DIR=/stage-artifacts \
              -e MOLD_ARG="${MOLD}" \
              -e PLATFORM_ARG="${PLATFORM}" \
              -e ARCH_ARG="${ARCH}" \
              -w /workspace \
              "${CONTAINER}" \
              bash -c '
                set -euo pipefail
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  sudo ca-certificates curl jq xz-utils \
                  file binutils python3 python3-pip \
                  make patch gcc g++ tar gzip bzip2 m4
                python3 -c "import tomllib" 2>/dev/null || pip3 install tomli
                scripts/cast-ingot.sh "${MOLD_ARG}" "${PLATFORM_ARG}" "${ARCH_ARG}"
              '
          else
            CAST_STAGE=configure \
            STAGE_ARTIFACT_DIR="${STAGE_DIR}" \
              scripts/cast-ingot.sh "${MOLD}" "${PLATFORM}" "${ARCH}"
          fi

      - name: Upload configure stage artifact
        uses: actions/upload-artifact@v7
        with:
          name: stage-configure-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/configure-tree.tar.gz
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: logs-configure-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/*.log
          retention-days: 3

  cast-build-make:
    needs: [detect-build-targets, cast-build-configure]
    if: needs.detect-build-targets.outputs.has_build_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    strategy:
      matrix: ${{ fromJSON(needs.detect-build-targets.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Maximize build space
        if: matrix.platform == 'linux'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Download configure stage artifact
        uses: actions/download-artifact@v8
        with:
          name: stage-configure-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/

      - name: Run make stage
        env:
          MOLD: ${{ matrix.mold }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/stage-artifacts"
          chmod +x scripts/cast-ingot.sh scripts/smoke-test.sh

          if [[ -n "${CONTAINER}" ]]; then
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace" \
              -v "${STAGE_DIR}:/stage-artifacts" \
              -e CAST_STAGE=make \
              -e STAGE_ARTIFACT_DIR=/stage-artifacts \
              -e MOLD_ARG="${MOLD}" \
              -e PLATFORM_ARG="${PLATFORM}" \
              -e ARCH_ARG="${ARCH}" \
              -w /workspace \
              "${CONTAINER}" \
              bash -c '
                set -euo pipefail
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  sudo ca-certificates curl jq xz-utils \
                  file binutils python3 python3-pip \
                  make patch gcc g++ tar gzip bzip2 m4
                python3 -c "import tomllib" 2>/dev/null || pip3 install tomli
                scripts/cast-ingot.sh "${MOLD_ARG}" "${PLATFORM_ARG}" "${ARCH_ARG}"
              '
          else
            CAST_STAGE=make \
            STAGE_ARTIFACT_DIR="${STAGE_DIR}" \
              scripts/cast-ingot.sh "${MOLD}" "${PLATFORM}" "${ARCH}"
          fi

      - name: Upload make stage artifact
        uses: actions/upload-artifact@v7
        with:
          name: stage-make-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/installed-tree.tar.gz
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: logs-make-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/*.log
          retention-days: 3

  cast-build-package:
    needs: [detect-build-targets, cast-build-make]
    if: needs.detect-build-targets.outputs.has_build_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.detect-build-targets.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Download make stage artifact
        uses: actions/download-artifact@v8
        with:
          name: stage-make-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-artifacts/

      - name: Run package stage
        env:
          MOLD: ${{ matrix.mold }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/stage-artifacts"
          OUTPUT_DIR="${RUNNER_TEMP}/output"
          mkdir -p "${OUTPUT_DIR}"
          chmod +x scripts/cast-ingot.sh scripts/smoke-test.sh

          if [[ -n "${CONTAINER}" ]]; then
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace" \
              -v "${STAGE_DIR}:/stage-artifacts" \
              -v "${OUTPUT_DIR}:/output" \
              -e CAST_STAGE=package \
              -e STAGE_ARTIFACT_DIR=/stage-artifacts \
              -e OUTPUT_DIR=/output \
              -e MOLD_ARG="${MOLD}" \
              -e PLATFORM_ARG="${PLATFORM}" \
              -e ARCH_ARG="${ARCH}" \
              -w /workspace \
              "${CONTAINER}" \
              bash -c '
                set -euo pipefail
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  sudo ca-certificates curl jq xz-utils \
                  file binutils python3 python3-pip \
                  make patch gcc g++ tar gzip bzip2 m4
                python3 -c "import tomllib" 2>/dev/null || pip3 install tomli
                scripts/cast-ingot.sh "${MOLD_ARG}" "${PLATFORM_ARG}" "${ARCH_ARG}"
              '
          else
            CAST_STAGE=package \
            STAGE_ARTIFACT_DIR="${STAGE_DIR}" \
            OUTPUT_DIR="${OUTPUT_DIR}" \
              scripts/cast-ingot.sh "${MOLD}" "${PLATFORM}" "${ARCH}"
          fi

      # The package stage's smoke test runs in the build container, which
      # has the build's tools and libraries installed. This runs it again
      # where they are absent: in the build image, and in the latest
      # Ubuntu LTS, which lacks libraries the build image happens to have.
      - name: Smoke test in a minimal container
        if: matrix.container != ''
        env:
          MOLD: ${{ matrix.mold }}
          CONTAINER: ${{ matrix.container }}
          LATEST_IMAGE: ubuntu:24.04
        run: |
          set -euo pipefail
          mapfile -t INGOTS < <(find "${RUNNER_TEMP}/output" -name '*.tar.xz' -type f)
          if [[ ${#INGOTS[@]} -ne 1 ]]; then
            echo "::error::Expected one ingot archive, found ${#INGOTS[@]}"
            exit 1
          fi
          INGOT_DIR="${RUNNER_TEMP}/minimal-ingot"
          mkdir -p "$INGOT_DIR"
          tar -xJf "${INGOTS[0]}" -C "$INGOT_DIR"
          scripts/smoke-test-minimal.sh "$INGOT_DIR" "$MOLD" "$CONTAINER"
          if [[ "$LATEST_IMAGE" != "$CONTAINER" ]]; then
            scripts/smoke-test-minimal.sh "$INGOT_DIR" "$MOLD" "$LATEST_IMAGE"
          fi

      - name: Upload ingot artifact
        uses: actions/upload-artifact@v7
        with:
          name: ingot-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/output/
          retention-days: 3

  # ============================================================
  # Fetch-type molds whose binary entries remove DT_NEEDED entries.
  #
  # The binaries no longer match the upstream archive, so they are
  # published as ingots. One run of cast-ingot.sh covers download through
  # the archive; there are no stages. Linux only, inside the container
  # that matches glibc_min, launched like the build stages. The packages
  # are those of the fetch validation in pr-validation.yml.
  # ============================================================

  cast-fetch:
    needs: detect-build-targets
    if: needs.detect-build-targets.outputs.has_fetch_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix: ${{ fromJSON(needs.detect-build-targets.outputs.fetch_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Maximize build space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Run fetch cast
        env:
          MOLD: ${{ matrix.mold }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/output"
          mkdir -p "${OUTPUT_DIR}"
          chmod +x scripts/cast-ingot.sh scripts/smoke-test.sh

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${OUTPUT_DIR}:/output" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e OUTPUT_DIR=/output \
            -e MOLD_ARG="${MOLD}" \
            -e PLATFORM_ARG="${PLATFORM}" \
            -e ARCH_ARG="${ARCH}" \
            -w /workspace \
            "${CONTAINER}" \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq \
                ca-certificates curl jq xz-utils file binutils \
                python3-pip libc6-dev libxml2 patchelf libatomic1
              python3 -c "import tomllib" 2>/dev/null || pip3 install tomli
              scripts/cast-ingot.sh "${MOLD_ARG}" "${PLATFORM_ARG}" "${ARCH_ARG}"
            '

      - name: Smoke test libc++ in a minimal container
        if: matrix.family == 'llvm'
        env:
          CONTAINER: ${{ matrix.container }}
          LATEST_IMAGE: ubuntu:24.04
        run: |
          set -euo pipefail
          mapfile -t INGOTS < <(find "${RUNNER_TEMP}/output" -name '*.tar.xz' -type f)
          if [[ ${#INGOTS[@]} -ne 1 ]]; then
            echo "::error::Expected one ingot archive, found ${#INGOTS[@]}"
            exit 1
          fi
          INGOT_DIR="${RUNNER_TEMP}/minimal-ingot"
          mkdir -p "$INGOT_DIR"
          tar -xJf "${INGOTS[0]}" -C "$INGOT_DIR"
          RUN_IMAGES=("$CONTAINER")
          if [[ "$LATEST_IMAGE" != "$CONTAINER" ]]; then
            RUN_IMAGES+=("$LATEST_IMAGE")
          fi
          scripts/smoke-test-libcxx.sh "$INGOT_DIR" "$CONTAINER" "${RUN_IMAGES[@]}"

      - name: Upload ingot artifact
        uses: actions/upload-artifact@v7
        with:
          name: ingot-${{ matrix.family }}-${{ matrix.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/output/
          retention-days: 3

  # upload-package: Consolidate ingot artifacts and publish to ghcr.io (OCI).
  #
  # Design:
  #   - Push each platform's ingot as a separate OCI artifact with a
  #     platform-specific tag (e.g., gcc:14.2.0-linux-x86_64)
  #   - Create an OCI Index manifest combining all platforms under the
  #     version tag (e.g., gcc:14.2.0)
  #   - Output package-manifest JSON for downstream index generation
  #   - Partial release prevention: skip molds missing any platform they
  #     cast (Tier 1 platforms for build-type molds, those removing
  #     DT_NEEDED entries for fetch-type molds)
  #
  # Dependency design:
  #   needs does NOT include cast-build-configure or cast-build-make.
  #   Intermediate stage failures propagate via GHA default behavior:
  #   cast-build-make failure -> cast-build-package skipped -> upload-package
  #   runs (via always()) but finds no artifacts -> per-mold completeness
  #   check skips the mold -> no partial release.
  #   A failed cast-build-package or cast-fetch cell likewise leaves only its
  #   own mold incomplete, so the other molds are still published.
  upload-package:
    needs: [detect-build-targets, cast-build-package, cast-fetch]
    if: |
      always()
      && (needs.detect-build-targets.outputs.has_build_targets == 'true'
          || needs.detect-build-targets.outputs.has_fetch_targets == 'true')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up oras
        uses: oras-project/setup-oras@v2
        with:
          version: '1.2.2'

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Download all artifacts
        id: download
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: ingot-*
          merge-multiple: true
        continue-on-error: true

      - name: Push to ghcr.io and generate package manifests
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MANIFEST_DIR="package-manifests"
          mkdir -p "$MANIFEST_DIR"

          # Assembled OCI Indexes. Kept out of MANIFEST_DIR, which is uploaded.
          INDEX_DIR="oci-indexes"
          mkdir -p "$INDEX_DIR"

          # Collect all ingot-metadata JSON files.
          # When build stages were skipped (e.g., partial failure), there may
          # be no artifacts at all — handle gracefully.
          mkdir -p artifacts/
          mapfile -t METADATA_FILES < <(find artifacts/ -name 'ingot-metadata-*.json' -type f 2>/dev/null | sort)

          if [[ ${#METADATA_FILES[@]} -eq 0 ]]; then
            echo "::warning::No ingot metadata files found — build stages may have been skipped"
            echo ""
            echo "=== Summary: 0 pushed, 0 skipped, 0 failed ==="
            exit 0
          fi

          # Group metadata by family-version (newline-delimited for robustness)
          declare -A MOLD_META_FILES

          for meta_file in "${METADATA_FILES[@]}"; do
            FAMILY=$(jq -r '.family' "$meta_file")
            VERSION=$(jq -r '.version' "$meta_file")
            KEY="${FAMILY}/${VERSION}"
            MOLD_META_FILES["$KEY"]+="${meta_file}"$'\n'
          done

          PUSH_COUNT=0
          SKIP_COUNT=0
          FAILURE_COUNT=0

          mapfile -t SORTED_KEYS < <(printf '%s\n' "${!MOLD_META_FILES[@]}" | sort)
          for key in "${SORTED_KEYS[@]}"; do
            mapfile -t META_LIST <<< "${MOLD_META_FILES[$key]}"
            # Remove trailing empty element from trailing newline
            [[ -z "${META_LIST[-1]}" ]] && unset 'META_LIST[-1]'
            PLATFORM_COUNT=${#META_LIST[@]}

            # Determine expected platform count: intersect the platforms the
            # mold casts with Tier 1 platforms. A fetch-type mold casts those
            # whose binary entry removes DT_NEEDED entries; a build-type mold
            # those in source.platforms.supported, or all when it is omitted.
            MOLD_DIR="molds/${key}"
            EXPECTED_COUNT=$(MOLD_VAR="$MOLD_DIR" python3 -c "
          import tomllib, os
          mold = os.environ['MOLD_VAR']
          with open(f'{mold}/mold.toml', 'rb') as f:
              mold_data = tomllib.load(f)
          with open('platforms.toml', 'rb') as f:
              plat_data = tomllib.load(f)
          tier1_ids = {f\"{p['platform']}-{p['arch']}\" for p in plat_data['platforms']['tier1']}
          source = mold_data.get('source', {})
          supported = source.get('platforms', {}).get('supported', [])
          if source.get('type') == 'fetch':
              cast_ids = {f\"{b['platform']}-{b['arch']}\" for b in source.get('binaries', []) if b.get('remove_needed')}
              count = len(cast_ids & tier1_ids)
          elif supported:
              count = len(set(supported) & tier1_ids)
          else:
              count = len(tier1_ids)
          print(count)
          ")

            echo ""
            echo "=== Processing: ${key} (${PLATFORM_COUNT}/${EXPECTED_COUNT} platforms) ==="

            # Per-mold completeness check: skip if not all expected platforms present
            if [[ "$PLATFORM_COUNT" -lt "$EXPECTED_COUNT" ]]; then
              echo "::warning::Skipping ${key}: only ${PLATFORM_COUNT}/${EXPECTED_COUNT} platforms available"
              SKIP_COUNT=$((SKIP_COUNT + 1))
              continue
            fi

            FIRST_META="${META_LIST[0]}"
            FAMILY=$(jq -r '.family' "$FIRST_META")
            VERSION=$(jq -r '.version' "$FIRST_META")

            # Validate FAMILY and VERSION are non-empty and OCI-tag-safe
            if [[ -z "$FAMILY" || -z "$VERSION" ]]; then
              echo "::error::Empty family or version in metadata: ${FIRST_META}"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              continue
            fi
            if ! [[ "$FAMILY" =~ ^[a-zA-Z0-9._-]+$ && "$VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Invalid family '${FAMILY}' or version '${VERSION}' for OCI tag"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              continue
            fi

            # --- OCI tag ---
            # A toolchain is identified by family, version, platform and
            # architecture, so rebuilding a version moves its tags onto the
            # new manifests. The old ones stay in the registry, reachable by
            # digest, and the index stops naming them.
            REPO_REF="${REGISTRY}/${FAMILY}"

            echo "OCI tag: ${FAMILY}:${VERSION}"

            # --- Push each platform's ingot ---
            PUSH_FAILED=false
            ASSETS_JSON="[]"
            INDEX_DESCRIPTORS="[]"

            for meta_file in "${META_LIST[@]}"; do
              # One value per line. Tab counts as whitespace to IFS, so a
              # tab-separated read would let an empty field shift into its
              # neighbour.
              mapfile -t META_FIELDS < <(
                jq -r '.platform, .arch, .ingot_file, .source_type, (.glibc_version // "")' "$meta_file"
              )
              PLATFORM="${META_FIELDS[0]:-}"
              ARCH="${META_FIELDS[1]:-}"
              INGOT_FILE="${META_FIELDS[2]:-}"
              SOURCE_TYPE="${META_FIELDS[3]:-}"
              GLIBC_VERSION="${META_FIELDS[4]:-}"

              if [[ "$SOURCE_TYPE" != "build" && "$SOURCE_TYPE" != "fetch" ]]; then
                echo "::error::Invalid source_type '${SOURCE_TYPE}' in ${meta_file}"
                PUSH_FAILED=true
                break
              fi

              PLATFORM_TAG="${VERSION}-${PLATFORM}-${ARCH}"

              # Find the ingot file in artifacts
              INGOT_PATH=$(find artifacts/ -name "$INGOT_FILE" -type f | head -1)
              if [[ -z "$INGOT_PATH" ]]; then
                echo "::error::Ingot file not found: ${INGOT_FILE}"
                PUSH_FAILED=true
                break
              fi

              echo "  Pushing: ${INGOT_FILE} -> ${REPO_REF}:${PLATFORM_TAG}"

              # Build annotation arguments
              ANNOTATIONS=(
                --annotation "org.opencontainers.image.title=${INGOT_FILE}"
                --annotation "org.skipbit.scrap.family=${FAMILY}"
                --annotation "org.skipbit.scrap.version=${VERSION}"
                --annotation "org.skipbit.scrap.platform=${PLATFORM}"
                --annotation "org.skipbit.scrap.arch=${ARCH}"
                --annotation "org.skipbit.scrap.source_type=${SOURCE_TYPE}"
              )
              if [[ -n "$GLIBC_VERSION" ]]; then
                ANNOTATIONS+=(--annotation "org.skipbit.scrap.glibc_version=${GLIBC_VERSION}")
              fi

              # Push with retry (max 2 attempts).
              # Capture stdout (JSON) separately from stderr (progress/errors).
              PUSH_OUTPUT=""
              PUSH_OK=false
              for attempt in 1 2; do
                PUSH_STDERR=$(mktemp)
                if PUSH_OUTPUT=$(oras push "${REPO_REF}:${PLATFORM_TAG}" \
                  --artifact-type "application/vnd.skipbit.scrap.ingot.v1+tar.xz" \
                  "${ANNOTATIONS[@]}" \
                  "${INGOT_PATH}:application/x-tar+xz" \
                  --format json 2>"$PUSH_STDERR"); then
                  PUSH_OK=true
                  rm -f "$PUSH_STDERR"
                  break
                fi
                # oras names the cause here; the annotation below cannot.
                cat "$PUSH_STDERR"
                rm -f "$PUSH_STDERR"
                if [[ "$attempt" -lt 2 ]]; then
                  echo "  Push failed (attempt ${attempt}), retrying..."
                  sleep 3
                fi
              done

              if [[ "$PUSH_OK" != "true" ]]; then
                echo "::error::Failed to push ${INGOT_FILE}"
                PUSH_FAILED=true
                break
              fi

              # Validate the push output and describe this manifest for the
              # OCI Index in one pass. Splitting the fields into shell
              # variables would let a missing one shift into its neighbour.
              #
              # glibc_version rides along as an annotation: generate-index.sh
              # reads the index when no build artifacts are at hand, and would
              # otherwise lose it.
              DESCRIPTOR=$(jq -ecs \
                --arg os "$PLATFORM" \
                --arg arch "$ARCH" \
                --arg glibc "$GLIBC_VERSION" \
                'select(length == 1)
                 | .[0]
                 | select((.digest | strings | length) > 0)
                 | select((.mediaType | strings | length) > 0)
                 | select((.size | numbers) != null)
                 | {mediaType, digest, size,
                    platform: {os: $os,
                               architecture: ({"x86_64": "amd64", "aarch64": "arm64"}[$arch] // $arch)}}
                   + (if (.artifactType // "") != "" then {artifactType: .artifactType} else {} end)
                   + (if $glibc != "" then {annotations: {"org.skipbit.scrap.glibc_version": $glibc}} else {} end)' \
                <<< "$PUSH_OUTPUT" 2>/dev/null) || DESCRIPTOR=""
              if [[ -z "$DESCRIPTOR" ]]; then
                echo "::error::Incomplete push output for ${INGOT_FILE}"
                PUSH_FAILED=true
                break
              fi
              INDEX_DESCRIPTORS=$(jq --argjson d "$DESCRIPTOR" '. + [$d]' <<< "$INDEX_DESCRIPTORS")

              DIGEST=$(jq -r '.digest' <<< "$DESCRIPTOR")
              echo "  Pushed: digest=${DIGEST}"

              # Build asset entry for package-manifest (including digest)
              ASSET_ENTRY=$(jq -n \
                --arg ingot_file "$INGOT_FILE" \
                --arg platform "$PLATFORM" \
                --arg arch "$ARCH" \
                --arg digest "$DIGEST" \
                '{ingot_file: $ingot_file, platform: $platform, arch: $arch, digest: $digest}')
              ASSETS_JSON=$(echo "$ASSETS_JSON" | jq --argjson entry "$ASSET_ENTRY" '. + [$entry]')
            done

            if [[ "$PUSH_FAILED" == "true" ]]; then
              echo "::error::Aborting ${key} due to push failure"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              continue
            fi

            # --- Set package visibility to public ---
            # ghcr.io packages default to private. Attempt to set public visibility
            # after successful push. Try org endpoint first (most repos are org-owned),
            # then fall back to user endpoint. This requires appropriate token
            # permissions; if both fail, continue with a warning.
            echo "  Setting package visibility to public..."
            PKG_NAME="${GITHUB_REPOSITORY#*/}%2F${FAMILY}"
            OWNER="${GITHUB_REPOSITORY_OWNER}"
            if ! gh api --method PUT \
              "/orgs/${OWNER}/packages/container/${PKG_NAME}/visibility" \
              -f visibility=public 2>/dev/null; then
              if ! gh api --method PUT \
                "/user/packages/container/${PKG_NAME}/visibility" \
                -f visibility=public 2>/dev/null; then
                echo "::warning::Could not set package visibility to public for ${FAMILY}. Manual configuration may be required."
              fi
            fi

            # --- Create OCI Index for multi-architecture ---
            # The index lets OCI-native tools resolve a platform-specific
            # manifest from the bare version tag, and it is what
            # generate-index.sh reads when no build artifacts are at hand.
            #
            # The index is assembled here rather than with `oras manifest index
            # create`: that command arrived in oras 1.3.0, and it fills in
            # platform from an image config, which ingots do not carry.
            echo "  Creating OCI Index: ${REPO_REF}:${VERSION}"

            # The hash of the mold these ingots are built from, so that
            # generate-index.sh can tell them from ingots of another version
            # of the mold.
            MOLD_HASH=$(python3 scripts/mold-hash.py "$MOLD_DIR")

            INDEX_FILE="${INDEX_DIR}/${FAMILY}-${VERSION}.json"
            jq -n --argjson manifests "$INDEX_DESCRIPTORS" \
              --arg mold_hash "$MOLD_HASH" '{
              schemaVersion: 2,
              mediaType: "application/vnd.oci.image.index.v1+json",
              annotations: {"org.skipbit.scrap.mold_hash": $mold_hash},
              manifests: $manifests
            }' > "$INDEX_FILE"

            INDEX_PUSHED=false
            for attempt in 1 2; do
              if oras manifest push "${REPO_REF}:${VERSION}" "$INDEX_FILE" \
                --media-type "application/vnd.oci.image.index.v1+json"; then
                INDEX_PUSHED=true
                break
              fi
              if [[ "$attempt" -lt 2 ]]; then
                echo "  Index push failed (attempt ${attempt}), retrying..."
                sleep 3
              fi
            done

            if [[ "$INDEX_PUSHED" != "true" ]]; then
              echo "::error::Failed to push the OCI Index for ${key} to ${REPO_REF}:${VERSION}"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              continue
            fi

            # Read the tag back: an exit status of 0 is not evidence that the
            # index is there. Compare the children with what was just pushed,
            # so that an index left by another run does not pass for this one.
            EXPECTED_DIGESTS=$(jq -c '[.[].digest] | sort' <<< "$INDEX_DESCRIPTORS")
            INDEX_VERIFIED=false
            for attempt in 1 2 3; do
              if oras manifest fetch "${REPO_REF}:${VERSION}" \
                | jq -e --argjson expected "$EXPECTED_DIGESTS" \
                  '.mediaType == "application/vnd.oci.image.index.v1+json"
                   and ([.manifests[].digest] | sort) == $expected' >/dev/null; then
                INDEX_VERIFIED=true
                break
              fi
              # The tag already points at this index, so failing here leaves
              # the registry ahead of index.toml. Back off rather than give up
              # on the second try.
              if [[ "$attempt" -lt 3 ]]; then
                echo "  Index not retrievable yet (attempt ${attempt}), retrying..."
                sleep $(( attempt * 3 ))
              fi
            done

            if [[ "$INDEX_VERIFIED" != "true" ]]; then
              echo "::error::OCI Index at ${REPO_REF}:${VERSION} does not read back as pushed for ${key}"
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
              continue
            fi
            echo "  OCI Index created"

            # --- Generate package-manifest JSON ---
            CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq -n \
              --arg family "$FAMILY" \
              --arg version "$VERSION" \
              --arg oci_tag "${FAMILY}:${VERSION}" \
              --argjson assets "$ASSETS_JSON" \
              --arg mold_hash "$MOLD_HASH" \
              --arg created_at "$CREATED_AT" \
              '{
                family: $family,
                version: $version,
                oci_tag: $oci_tag,
                mold_hash: $mold_hash,
                assets: $assets,
                created_at: $created_at
              }' > "${MANIFEST_DIR}/package-manifest-${FAMILY}-${VERSION}.json"

            echo "  Package manifest written"
            PUSH_COUNT=$((PUSH_COUNT + 1))
          done

          echo ""
          echo "=== Summary: ${PUSH_COUNT} pushed, ${SKIP_COUNT} skipped, ${FAILURE_COUNT} failed ==="

          if [[ "$FAILURE_COUNT" -gt 0 ]]; then
            exit 1
          fi

      # Uploaded even when a mold failed, so that one mold does not cost the
      # others their manifests: Index Update runs on any conclusion, and
      # without a manifest it rebuilds those entries from the registry.
      - name: Upload package manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-manifest
          path: package-manifests/
          retention-days: 3
          if-no-files-found: warn
