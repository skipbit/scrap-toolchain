name: Toolchain Watch

# Opens one pull request per upstream release that has no mold yet. The
# pull requests are reviewed and merged by hand; merging starts Ingot Cast
# as for any other mold change.
#
# A pull request is opened once per release. Closing it without merging
# keeps the release out: the workflow does not open it again.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the new releases without opening pull requests'
        type: boolean
        default: false
      only:
        description: 'Limit to one release, e.g. llvm-22.1.1'
        type: string
        default: ''

concurrency:
  group: toolchain-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find-releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      # The pull requests are built on the checked-out branch and target
      # main, so a run from any other branch would carry its commits.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Find new releases
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          RELEASES=$(scripts/find-new-releases.sh)
          if [[ -n "$ONLY" ]]; then
            RELEASES=$(jq --arg id "$ONLY" 'map(select(.id == $id))' <<< "$RELEASES")
          fi
          echo "releases=$(jq -c . <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

          {
            echo "## New releases"
            echo
            if [[ "$(jq length <<< "$RELEASES")" -eq 0 ]]; then
              echo "None."
            else
              echo "| Release | Derived from | Missing files |"
              echo "|---------|--------------|---------------|"
              jq -r '.[] | "| \(.id) | \(.base) | \(.missing | join(", ")) |"' <<< "$RELEASES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  open-pull-request:
    needs: find-releases
    if: needs.find-releases.outputs.releases != '[]' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.find-releases.outputs.releases) }}
    steps:
      # The default token cannot be used: pull requests it opens do not
      # start PR Validation.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for an earlier pull request
        id: earlier
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: toolchain/${{ matrix.release.id }}
        run: |
          COUNT=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state all \
            --json number --jq length)
          if [[ "$COUNT" -gt 0 ]]; then
            echo "A pull request from ${BRANCH} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the mold
        if: steps.earlier.outputs.skip == 'false'
        id: mold
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ matrix.release.base }}
          VERSION: ${{ matrix.release.version }}
          MISSING: ${{ join(matrix.release.missing, ' ') }}
        run: |
          # shellcheck disable=SC2086  # MISSING is a list of file names
          MOLD_DIR=$(scripts/write-mold.sh "$BASE" "$VERSION" $MISSING)
          echo "dir=${MOLD_DIR}" >> "$GITHUB_OUTPUT"

          TYPE=$(MOLD_DIR="$MOLD_DIR" python3 - <<'EOF'
          import os, tomllib
          with open(os.path.join(os.environ['MOLD_DIR'], 'mold.toml'), 'rb') as f:
              print(tomllib.load(f)['source']['type'])
          EOF
          )
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"

      # glibc_min is what the index publishes for the binaries, so it is
      # set to what this release measures rather than carried over.
      - name: Measure the glibc requirement
        if: steps.earlier.outputs.skip == 'false' && steps.mold.outputs.type == 'fetch'
        env:
          MOLD_DIR: ${{ steps.mold.outputs.dir }}
        run: |
          set -o pipefail

          # linux-binaries.txt: "<arch> <strip components> <sha256> <url>
          # [root dir]" per Linux binary, in mold order; excluded.txt: one
          # path per line
          python3 - <<'EOF'
          import os, tomllib
          with open(os.path.join(os.environ['MOLD_DIR'], 'mold.toml'), 'rb') as f:
              source = tomllib.load(f)['source']
          with open('linux-binaries.txt', 'w') as out:
              for b in source['binaries']:
                  if b['platform'] == 'linux':
                      print(b['arch'], b.get('strip_components', 1), b['sha256'], b['url'],
                            b.get('root_dir', ''), file=out)
          with open('excluded.txt', 'w') as out:
              for path in source.get('glibc_exclude', []):
                  print(path, file=out)
          EOF
          mapfile -t EXCLUDED < excluded.txt

          # measured.txt: "<arch>=<measured>"
          # The ingot is the extracted archive, or its root_dir when the mold
          # sets one, as in cast-ingot.sh.
          EXTRACT_DIR="${RUNNER_TEMP}/extract"
          ARCHIVE="${RUNNER_TEMP}/archive"
          : > measured.txt
          while read -r arch strip sha256 url root_dir; do
            curl -fsSL --retry 3 -o "$ARCHIVE" "$url"
            echo "${sha256}  ${ARCHIVE}" | sha256sum -c --quiet
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            tar -xf "$ARCHIVE" --strip-components="$strip" -C "$EXTRACT_DIR"
            rm -f "$ARCHIVE"
            need=$(scripts/measure-glibc.sh "${EXTRACT_DIR}/${root_dir}" "${EXCLUDED[@]}")
            echo "${arch}=${need}" >> measured.txt
            rm -rf "$EXTRACT_DIR"
          done < linux-binaries.txt

          # Writes the highest measured version into the mold as glibc_min,
          # and the pull request body fragment describing it.
          python3 - "${MOLD_DIR}/mold.toml" measured.txt excluded.txt > glibc-section.md <<'EOF'
          import re, sys
          mold, measured, excluded = sys.argv[1:]
          with open(measured) as f:
              rows = dict(line.strip().split('=', 1) for line in f)
          if not rows:
              sys.exit('no Linux binary was measured')
          need = max(rows.values(), key=lambda v: tuple(int(x) for x in v.split('.')))
          text = open(mold).read()
          old = re.search(r'^glibc_min = "(.*)"$', text, re.M)
          if old is None:
              sys.exit(f'{mold} has no glibc_min line')
          text = text[:old.start()] + f'glibc_min = "{need}"' + text[old.end():]
          open(mold, 'w').write(text)
          with open(excluded) as f:
              paths = [line.strip() for line in f if line.strip()]
          print(f"`glibc_min` is set to {need}, the highest glibc version the")
          print("Linux binaries require over every ELF file they contain", end='')
          print(f" except {', '.join(f'`{p}`' for p in paths)}:" if paths else ":")
          print()
          for arch, value in rows.items():
              print(f"- {arch}: {value}")
          print()
          if old.group(1) != need:
              print(f"**This changes `glibc_min` from {old.group(1)}** in the")
              print("mold it was copied from.")
              print()
          EOF
          cat glibc-section.md

      - name: Open the pull request
        if: steps.earlier.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: toolchain/${{ matrix.release.id }}
          FAMILY: ${{ matrix.release.family }}
          VERSION: ${{ matrix.release.version }}
          BASE: ${{ matrix.release.base }}
          MOLD_DIR: ${{ steps.mold.outputs.dir }}
          MISSING: ${{ join(matrix.release.missing, ', ') }}
          SOURCE_TYPE: ${{ steps.mold.outputs.type }}
        run: |
          TITLE="feat: add ${FAMILY^^} ${VERSION} mold definition"

          {
            echo "Adds the mold for ${FAMILY^^} ${VERSION}, copied from \`${BASE}\`"
            echo "with the version, download URLs and checksums changed."
            echo "Everything else is carried over and needs review."
            echo
            if [[ -n "$MISSING" ]]; then
              echo "**Upstream has not published ${MISSING}.** The release is"
              echo "older than a week, so the platforms with files are added"
              echo "and the rest are left out."
              echo
            fi
            if [[ -f glibc-section.md ]]; then
              cat glibc-section.md
            fi
            if [[ "$SOURCE_TYPE" == "build" ]]; then
              echo "PR Validation only configures GCC. The full build and the"
              echo "smoke test run after merging; if they fail, fix the mold in"
              echo "a follow-up pull request."
              echo
            fi
            echo "Opened by the Toolchain Watch workflow and never merged"
            echo "automatically. Closing it without merging keeps this release"
            echo "out; the workflow will not open it again."
          } > pr-body.md

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add "${MOLD_DIR}/mold.toml"
          git commit -m "$TITLE"
          # A branch left by a run that failed before opening the pull
          # request is replaced.
          git push --force origin "$BRANCH"
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$TITLE" --body-file pr-body.md

  report-failure:
    needs: [find-releases, open-pull-request]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Toolchain Watch failed"
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"${TITLE}\"" \
            --json number,title | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [[ -n "$NUMBER" ]]; then
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "Failed again: ${RUN_URL}"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The check for new toolchain releases failed: ${RUN_URL}"
          fi
