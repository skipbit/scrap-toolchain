[metadata]
schema_version = 1
family = "gcc"
version = "13.3.0"
status = "active"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
license_files = ["COPYING", "COPYING.RUNTIME"]
homepage = "https://gcc.gnu.org"
description = "GNU Compiler Collection (GCC)"

[metadata.components]
compiler = "g++"
stdlib = "libstdc++"

[source]
type = "build"

# GCC 13.3.0 does not support aarch64-apple-darwin natively.
# Homebrew applies custom patches (iains/gcc-14-branch) to enable it.
[source.platforms]
supported = ["linux-x86_64", "linux-aarch64"]

[source.build]
source_url = "https://ftp.gnu.org/gnu/gcc/gcc-13.3.0/gcc-13.3.0.tar.xz"
source_sha256 = "0845e9621c9543a13f484e94584a49ffc0129970e9914624235fc1d061a0c083"
configure_args = [
    "--enable-languages=c,c++",
    "--disable-multilib",
    "--disable-bootstrap",
    "--enable-checking=release",
    "--disable-nls",
]
make_args = ["-j$(nproc)"]

[source.build.prerequisites]
apt = ["libgmp-dev", "libmpfr-dev", "libmpc-dev", "libisl-dev"]

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler} -std=c++23 -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
