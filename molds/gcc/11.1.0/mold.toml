[metadata]
schema_version = 1
family = "gcc"
version = "11.1.0"
status = "active"
license = "GPL-3.0-or-later WITH GCC-exception-3.1 AND (LGPL-3.0-or-later OR GPL-2.0-or-later) AND LGPL-3.0-or-later AND MIT"
license_files = ["COPYING", "COPYING.RUNTIME"]
homepage = "https://gcc.gnu.org"
description = "GNU Compiler Collection (GCC)"

[metadata.components]
compiler = "g++"
stdlib = "libstdc++"

[source]
type = "build"

# GCC 11.1.0 does not support aarch64-apple-darwin natively.
# Homebrew applies custom patches (iains/gcc-14-branch) to enable it.
[source.platforms]
supported = ["linux-x86_64", "linux-aarch64"]

[source.build]
source_url = "https://ftp.gnu.org/gnu/gcc/gcc-11.1.0/gcc-11.1.0.tar.xz"
source_sha256 = "4c4a6fb8a8396059241c2e674b85b351c26a5d678274007f076957afa1cc9ddf"
configure_args = [
    "--enable-languages=c,c++",
    "--disable-multilib",
    "--disable-bootstrap",
    "--enable-checking=release",
    "--disable-nls",
]
make_args = ["-j$(nproc)"]

[[source.build.in_tree]]
path = "gmp"
url = "https://gcc.gnu.org/pub/gcc/infrastructure/gmp-6.1.0.tar.bz2"
sha256 = "498449a994efeba527885c10405993427995d3f86b8768d8cdf8d9dd7c6b73e8"
license_files = ["COPYING.LESSERv3", "COPYINGv2", "COPYINGv3"]

[[source.build.in_tree]]
path = "mpfr"
url = "https://gcc.gnu.org/pub/gcc/infrastructure/mpfr-3.1.4.tar.bz2"
sha256 = "d3103a80cdad2407ed581f3618c4bed04e0c92d1cf771a65ead662cc397f7775"
license_files = ["COPYING.LESSER", "COPYING"]

[[source.build.in_tree]]
path = "mpc"
url = "https://gcc.gnu.org/pub/gcc/infrastructure/mpc-1.0.3.tar.gz"
sha256 = "617decc6ea09889fb08ede330917a00b16809b8db88c29c31bfbb49cbf88ecc3"
license_files = ["COPYING.LESSER"]

[[source.build.in_tree]]
path = "isl"
url = "https://gcc.gnu.org/pub/gcc/infrastructure/isl-0.18.tar.bz2"
sha256 = "6b8b0fd7f81d0a957beb3679c81bbb34ccc7568d5682844d8924424a0dadcb1b"
license_files = ["LICENSE"]

[[source.build.companions]]
name = "binutils"
url = "https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"
configure_args = [
    "--disable-nls",
    "--disable-werror",
    "--disable-gprofng",
    "--without-zstd",
    "--without-debuginfod",
]
license_files = ["COPYING3", "COPYING3.LIB"]

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler} -std=c++23 -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
