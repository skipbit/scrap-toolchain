[metadata]
schema_version = 1
family = "llvm"
version = "17.0.4"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.34"
glibc_exclude = ["bin/llvm-exegesis"]

[[source.binaries]]
platform = "linux"
arch = "x86_64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang%2Bllvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
sha256 = "6b45be6c0483b7ee3f63981678093b731fd9f4ea6987b4ceb6efde21890ffca7"

[[source.binaries]]
platform = "linux"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang%2Bllvm-17.0.4-aarch64-linux-gnu.tar.xz"
sha256 = "18b326b3e17168fc423726b5059b4d55b6070d49408e51440ad3fca2ebb37779"

[[source.binaries]]
platform = "darwin"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang%2Bllvm-17.0.4-arm64-apple-darwin22.0.tar.xz"
sha256 = "5d514fa64a290dca53288ce859e6ec59a0b48198b3a5b27ca53b6fe80a977b8d"

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler}++ -std=c++23 -fuse-ld=lld -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
