[metadata]
schema_version = 1
family = "llvm"
version = "21.1.6"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.34"
glibc_exclude = ["bin/llvm-exegesis"]

[[source.binaries]]
platform = "linux"
arch = "x86_64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-X64.tar.xz"
sha256 = "8ac1aadfa96b87b8747f7383d06ed9579f9d5c32a1af7af947b0cfe29d88ac87"

[[source.binaries]]
platform = "linux"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-ARM64.tar.xz"
sha256 = "1d8a9e05007b8b9005c63f90d7646b2b6263451d605cca070418d0a71e669377"

[[source.binaries]]
platform = "darwin"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-macOS-ARM64.tar.xz"
sha256 = "bdf036e9987b8706471b565f50178a34218909b1858a82c426269da49780b6ba"

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler}++ -std=c++23 -fuse-ld=lld -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
