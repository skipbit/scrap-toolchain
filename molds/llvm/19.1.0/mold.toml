[metadata]
schema_version = 1
family = "llvm"
version = "19.1.0"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.34"
glibc_exclude = ["bin/llvm-exegesis"]

[[source.binaries]]
platform = "linux"
arch = "x86_64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/LLVM-19.1.0-Linux-X64.tar.xz"
sha256 = "cee77d641690466a193d9b88c89705de1c02bbad46bde6a3b126793c0a0f2923"

[[source.binaries]]
platform = "linux"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/clang%2Bllvm-19.1.0-aarch64-linux-gnu.tar.xz"
sha256 = "7bb54afd330fe1a1c2d4c593fa1e2dbe2abd9bf34fb3597994ff41e443cf144b"

[[source.binaries]]
platform = "darwin"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/LLVM-19.1.0-macOS-ARM64.tar.xz"
sha256 = "9da86f64a99f5ce9b679caf54e938736ca269c5e069d0c94ad08b995c5f25c16"

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler}++ -std=c++23 -fuse-ld=lld -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
