[metadata]
schema_version = 1
family = "llvm"
version = "17.0.1"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.30"
glibc_exclude = ["bin/llvm-exegesis"]

[source.platforms]
supported = ["linux-aarch64", "darwin-aarch64"]

[[source.binaries]]
platform = "linux"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.1/clang%2Bllvm-17.0.1-aarch64-linux-gnu.tar.xz"
sha256 = "d2eaca72ce3aab0b343e01b2233303628ff43a43a6107dca1aa8d3039da847f5"

[[source.binaries]]
platform = "darwin"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.1/clang%2Bllvm-17.0.1-arm64-apple-darwin22.0.tar.xz"
sha256 = "d5678bc475c42c3ab7c0ee35ebd95534d81b6816507cfc9e42d86136d8315ebc"

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler}++ -std=c++23 -fuse-ld=lld -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
