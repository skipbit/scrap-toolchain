[metadata]
schema_version = 1
family = "llvm"
version = "22.1.8"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.34"

[[source.binaries]]
platform = "linux"
arch = "x86_64"
