[metadata]
schema_version = 1
family = "llvm"
version = "18.1.6"
status = "active"
license = "Apache-2.0 WITH LLVM-exception"
license_files = ["LICENSE.TXT"]
homepage = "https://llvm.org"
description = "LLVM toolchain (Clang, LLD, libc++)"

[metadata.components]
compiler = "clang"

[source]
type = "fetch"
glibc_min = "2.30"
glibc_exclude = ["bin/llvm-exegesis"]

[source.platforms]
supported = ["linux-aarch64"]

[[source.binaries]]
platform = "linux"
arch = "aarch64"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.6/clang%2Bllvm-18.1.6-aarch64-linux-gnu.tar.xz"
sha256 = "bcb3d53d3bd1027bc7f26544dff8cdc5ff74776add6eb994047326b284147a90"

[test]
hello_world_source = """
#include <iostream>
int main() {
    std::cout << "Hello, scrap!" << std::endl;
    return 0;
}
"""
compile_command = "{compiler}++ -std=c++23 -fuse-ld=lld -o hello hello.cpp"
expected_output = "Hello, scrap!\n"
